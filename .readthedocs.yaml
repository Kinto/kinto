version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    install:
      # The project dependencies are installed with plain pip here (and not
      # with ``make install-docs``) because the ``uv`` executable is not
      # available in the Read the Docs build environment.
      - python -m pip install --upgrade pip
      - python -m pip install -e .
      - python -m pip install -r docs/requirements.txt
    build:
      html:
        - python -m sphinx -a -W -n -b html -d $READTHEDOCS_OUTPUT/doctrees docs $READTHEDOCS_OUTPUT/html
